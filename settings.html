<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 500px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #333;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input[aria-invalid="true"] {
            border-color: #dc3545;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        .error-message.visible {
            display: block;
        }
        button {
            padding: 0.75rem 1.5rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #a5c8ed;
            cursor: not-allowed;
        }
        .success-message {
            color: #28a745;
            padding: 1rem;
            background-color: #d4edda;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Account Settings</h1>
    
    <div id="successMessage" class="success-message" role="alert" aria-live="polite">
        Settings successfully saved.
    </div>
    
    <form id="settingsForm" novalidate>
        <div class="form-group">
            <label for="name">Full Name <span aria-hidden="true">*</span></label>
            <input type="text" id="name" name="name" required aria-required="true" aria-describedby="nameError">
            <div id="nameError" class="error-message" role="alert"></div>
        </div>
        
        <div class="form-group">
            <label for="email">Email Address <span aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" required aria-required="true" aria-describedby="emailError">
            <div id="emailError" class="error-message" role="alert"></div>
        </div>
        
        <div class="form-group">
            <label for="notifications">Email Notifications</label>
            <select id="notifications" name="notifications">
                <option value="all">All notifications</option>
                <option value="important">Important only</option>
                <option value="none">None</option>
            </select>
        </div>
        
        <button type="submit" id="submitBtn" disabled>Save Changes</button>
    </form>

    <script src="settings.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('settingsForm');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submitBtn');
            const successMessage = document.getElementById('successMessage');
            
            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            
            let isNameValid = false;
            let isEmailValid = false;
            
            function updateSubmitButton() {
                submitBtn.disabled = !(isNameValid && isEmailValid);
            }
            
            function handleValidation(input, errorElement, validatorFn, updateValidityFn) {
                const error = validatorFn(input.value);
                if (error) {
                    input.setAttribute('aria-invalid', 'true');
                    errorElement.textContent = error;
                    errorElement.classList.add('visible');
                    updateValidityFn(false);
                } else {
                    input.setAttribute('aria-invalid', 'false');
                    errorElement.textContent = '';
                    errorElement.classList.remove('visible');
                    updateValidityFn(true);
                }
                updateSubmitButton();
            }
            
            nameInput.addEventListener('input', () => {
                handleValidation(nameInput, nameError, validateName, (val) => isNameValid = val);
            });
            
            emailInput.addEventListener('input', () => {
                handleValidation(emailInput, emailError, validateEmail, (val) => isEmailValid = val);
            });
            
            // Initial blur triggers validation
            nameInput.addEventListener('blur', () => {
                handleValidation(nameInput, nameError, validateName, (val) => isNameValid = val);
            });
            
            emailInput.addEventListener('blur', () => {
                handleValidation(emailInput, emailError, validateEmail, (val) => isEmailValid = val);
            });
            
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (isNameValid && isEmailValid) {
                    // Simulate API call
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Saving...';
                    
                    setTimeout(() => {
                        submitBtn.textContent = 'Save Changes';
                        successMessage.style.display = 'block';
                        
                        // Hide success message after 3 seconds
                        setTimeout(() => {
                            successMessage.style.display = 'none';
                        }, 3000);
                        
                    }, 1000);
                }
            });
        });
    </script>
</body>
</html>
