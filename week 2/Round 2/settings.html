<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Form - Round 2</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 400px; margin: auto; background-color: #f9f9f9; }
        .form-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        input:focus, select:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 2px rgba(0,123,255,0.25); }
        input[aria-invalid="true"] { border-color: #dc3545; }
        input[aria-invalid="true"]:focus { box-shadow: 0 0 0 2px rgba(220,53,69,0.25); }
        .error-message { color: #dc3545; font-size: 0.85em; margin-top: 5px; display: none; }
        button { width: 100%; padding: 12px 15px; background: #007bff; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: background 0.2s; }
        button:hover:not(:disabled) { background: #0056b3; }
        button:disabled { background: #6c757d; cursor: not-allowed; opacity: 0.65; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>User Settings</h2>
        <form id="settingsForm" novalidate>
            <div class="form-group">
                <label for="nameInput">Full Name</label>
                <input type="text" id="nameInput" name="name" aria-required="true" aria-invalid="false" aria-describedby="nameError">
                <div id="nameError" class="error-message" role="alert">Name must be at least 2 characters long.</div>
            </div>

            <div class="form-group">
                <label for="emailInput">Email Address</label>
                <input type="email" id="emailInput" name="email" aria-required="true" aria-invalid="false" aria-describedby="emailError">
                <div id="emailError" class="error-message" role="alert">Please enter a valid email address.</div>
            </div>

            <div class="form-group">
                <label for="notificationsSelect">Notification Preference</label>
                <select id="notificationsSelect" name="notifications" aria-required="true">
                    <option value="email">Email</option>
                    <option value="sms">SMS</option>
                    <option value="none">None</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" disabled>Save Settings</button>
            <div id="formFeedback" role="alert" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
        </form>
    </div>
    <script src="settings.js"></script>
</body>
</html>
